<!-- public/reports.html -->
<!-- 14-T Reports Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14-T — Reports</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="logo">14-T</div>
      <div class="tagline">Home Citation System</div>
    </div>
    <nav>
      <a href="index.html">New Ticket</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="reports.html">Reports</a>
      <a href="management.html">Management</a>
    </nav>
  </header>

  <main>
    <h1>Submitted Reports</h1>

    <div id="reports-list">
      <div class="msg" style="display:block;background:var(--blue-light);color:var(--blue-dark);padding:14px;">Loading reports...</div>
    </div>
  </main>

  <footer>14-T Home Citation System</footer>
  <script>
    const DECLINE_REASONS = [
      'Not enough information',
      'Item has already been addressed',
      'Not a violation',
      'Duplicate report',
      'Item belongs there',
      'Outside jurisdiction',
      'Other',
    ];

    function statusBadge(status) {
      const map = {
        open: { label: 'Open', color: 'var(--blue)', bg: 'var(--blue-light)' },
        reviewed: { label: 'Reviewed', color: '#a07000', bg: '#fff8e6' },
        ticket_created: { label: 'Ticket Created', color: 'var(--success)', bg: '#e8f5e8' },
        declined: { label: 'Declined', color: 'var(--accent)', bg: '#fde8e8' },
      };
      const s = map[status] || { label: status, color: 'var(--muted)', bg: 'var(--bg)' };
      return `<span style="background:${s.bg};color:${s.color};padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">${s.label}</span>`;
    }

    function buildReportCard(r) {
      const date = new Date(r.created_at).toLocaleString();
      const reporterName = `${r.reporter_first} ${r.reporter_last_initial}.`;

      return `
        <div class="card" style="margin-bottom:16px;" id="card-${r.id}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:12px;">
            <div>
              <div style="font-size:11px;color:var(--muted);font-family:monospace;">${r.id}</div>
              <div style="font-size:16px;font-weight:700;margin-top:2px;">${r.item}</div>
              <div style="font-size:13px;color:var(--muted);">at ${r.location} · by ${reporterName} · ${date}</div>
            </div>
            ${statusBadge(r.status)}
          </div>

          <div style="font-size:14px;background:var(--bg);padding:10px;border-left:3px solid var(--border);margin-bottom:12px;">${r.description}</div>

          ${r.owner ? `<div style="font-size:13px;margin-bottom:10px;"><strong>Possible owner:</strong> ${r.owner}</div>` : ''}

          ${r.photo_base64 ? `<img src="${r.photo_base64}" style="width:100%;max-height:220px;object-fit:cover;border:1px solid var(--border);margin-bottom:12px;">` : ''}

          ${r.decline_reason ? `<div style="font-size:13px;color:var(--accent);margin-bottom:10px;"><strong>Decline reason:</strong> ${r.decline_reason}</div>` : ''}

          <div id="actions-${r.id}" style="display:flex;gap:8px;flex-wrap:wrap;">
            ${r.status === 'open' || r.status === 'reviewed' ? `
              <button onclick="createTicket('${r.id}')" style="background:var(--blue);color:#fff;padding:8px 16px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;">Issue Ticket from Report</button>
              <button onclick="markReviewed('${r.id}')" style="background:#a07000;color:#fff;padding:8px 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;">${r.status === 'reviewed' ? 'Mark as Open' : 'Mark Reviewed'}</button>
              <button onclick="openDeclineModal('${r.id}')" style="background:var(--accent);color:#fff;padding:8px 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;">Decline</button>
              <button onclick="deleteReport('${r.id}')" style="background:#999;color:#fff;padding:8px 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;">Delete</button>
            ` : r.status === 'declined' ? `
              <button onclick="markReviewed('${r.id}')" style="background:var(--blue);color:#fff;padding:8px 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;">Reopen</button>
              <button onclick="deleteReport('${r.id}')" style="background:#999;color:#fff;padding:8px 14px;font-size:13px;border:none;cursor:pointer;font-family:inherit;">Delete</button>
            ` : `
              <a href="report-status.html?id=${r.id}" target="_blank" style="font-size:12px;color:var(--blue);">View Status Page</a>
            `}
          </div>
        </div>`;
    }

    function openDeclineModal(id) {
      const existing = document.getElementById('decline-modal');
      if (existing) existing.remove();
      const modal = document.createElement('div');
      modal.id = 'decline-modal';
      modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
      modal.innerHTML = `
        <div style="background:#fff;max-width:420px;width:100%;border-top:4px solid var(--accent);">
          <div style="background:var(--accent);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;">
            <div style="font-size:15px;font-weight:700;">Decline Report</div>
            <button onclick="document.getElementById('decline-modal').remove()" style="background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff;padding:3px 9px;font-size:13px;cursor:pointer;">✕</button>
          </div>
          <div style="padding:18px;">
            <div class="field-group">
              <label for="decline-reason-select" style="font-size:13px;font-weight:600;margin-bottom:6px;display:block;">Reason <span style="color:var(--accent)">*</span></label>
              <select id="decline-reason-select" onchange="document.getElementById('decline-custom-wrap').style.display=this.value==='Other'?'block':'none'" style="margin-bottom:8px;">
                ${DECLINE_REASONS.map(r => `<option>${r}</option>`).join('')}
              </select>
              <div id="decline-custom-wrap" style="display:none;">
                <input type="text" id="decline-custom-text" placeholder="Enter custom reason...">
              </div>
            </div>
            <div style="display:flex;gap:10px;margin-top:6px;">
              <button onclick="submitDecline('${id}')" style="background:var(--accent);color:#fff;padding:10px 18px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;">Confirm Decline</button>
              <button onclick="document.getElementById('decline-modal').remove()" style="background:var(--white);color:var(--blue);border:1px solid var(--blue);padding:10px 16px;font-size:13px;cursor:pointer;font-family:inherit;">Cancel</button>
            </div>
          </div>
        </div>`;
      modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
      document.body.appendChild(modal);
    }

    async function submitDecline(id) {
      const sel = document.getElementById('decline-reason-select').value;
      const reason = sel === 'Other' ? (document.getElementById('decline-custom-text').value.trim() || 'Other') : sel;
      const res = await fetch('/api/report-action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, action: 'decline', reason }) });
      const data = await res.json();
      if (data.success) { document.getElementById('decline-modal').remove(); location.reload(); }
      else alert(data.error || 'Failed.');
    }

    async function markReviewed(id) {
      const res = await fetch('/api/report-action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, action: 'review' }) });
      const data = await res.json();
      if (data.success) location.reload();
      else alert(data.error || 'Failed.');
    }

    async function deleteReport(id) {
      if (!confirm('Permanently delete this report? This cannot be undone.')) return;
      const res = await fetch('/api/report-action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, action: 'delete' }) });
      const data = await res.json();
      if (data.success) { document.getElementById(`card-${id}`)?.remove(); }
      else alert(data.error || 'Failed.');
    }

    function createTicket(id) {
      // Store report data and redirect to new ticket page with pre-fill
      fetch(`/api/reports?id=${id}`)
        .then(r => r.json())
        .then(data => {
          if (!data.report) { alert('Report not found.'); return; }
          sessionStorage.setItem('prefill_report', JSON.stringify(data.report));
          // Mark as reviewed while issuer goes to issue ticket
          fetch('/api/report-action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, action: 'review' }) });
          window.location.href = 'index.html?from_report=' + id;
        });
    }

    // Load all reports
    fetch('/api/reports')
      .then(r => r.json())
      .then(data => {
        const reports = data.reports || [];
        const container = document.getElementById('reports-list');
        if (reports.length === 0) {
          container.innerHTML = '<div class="card" style="color:var(--muted);text-align:center;padding:30px;">No reports submitted yet.</div>';
          return;
        }
        // Sort: open/reviewed first, then by date desc
        const priority = { open: 0, reviewed: 1, declined: 2, ticket_created: 3 };
        reports.sort((a, b) => (priority[a.status] ?? 4) - (priority[b.status] ?? 4) || new Date(b.created_at) - new Date(a.created_at));
        container.innerHTML = reports.map(buildReportCard).join('');
      })
      .catch(() => {
        document.getElementById('reports-list').innerHTML = '<div class="msg error" style="display:block;">Failed to load reports.</div>';
      });
  </script>
</body>
</html>
