<!-- public/dashboard.html -->
<!-- 14-T Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14-T — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="logo">14-T</div>
      <div class="tagline">Home Citation System</div>
    </div>
    <nav>
      <a href="index.html">New Ticket</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>
  </header>

  <main id="dashboard">
    <h1>Dashboard</h1>

    <div class="card">
      <h2>Points Leaderboard</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Total Points</th>
          </tr>
        </thead>
        <tbody id="leaderboard">
          <tr><td colspan="2" style="color:var(--muted)">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <h2 style="margin-bottom:0;">All Citations</h2>
        <span id="tickets-count" style="font-size:13px;color:var(--muted);"></span>
      </div>

      <!-- Filter Bar -->
      <div style="background:var(--bg);border:1px solid var(--border);padding:14px;margin-bottom:16px;">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:10px;">Filters</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">

          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px;">
            <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Sort By</label>
            <select id="f-sort" style="font-size:13px;padding:6px 8px;border:1px solid var(--border);">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
              <option value="person">Person A–Z</option>
              <option value="points-high">Most Points</option>
              <option value="points-low">Fewest Points</option>
            </select>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px;">
            <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Person</label>
            <select id="f-person" style="font-size:13px;padding:6px 8px;border:1px solid var(--border);">
              <option value="">All People</option>
            </select>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;min-width:140px;">
            <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Severity</label>
            <select id="f-severity" style="font-size:13px;padding:6px 8px;border:1px solid var(--border);">
              <option value="">All Types</option>
              <option value="notice">Notice</option>
              <option value="warning">Warning</option>
              <option value="removal">Removal Notice</option>
              <option value="minor">Minor</option>
              <option value="major">Major</option>
              <option value="severe">Severe</option>
              <option value="contest">Contested</option>
            </select>
          </div>

          <div style="display:flex;flex-direction:column;gap:4px;min-width:160px;">
            <label style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Status</label>
            <select id="f-status" style="font-size:13px;padding:6px 8px;border:1px solid var(--border);">
              <option value="">All Statuses</option>
              <option value="open">Open</option>
              <option value="appeal">Needs Response (Appeal)</option>
              <option value="reply">Follow-up Reply</option>
              <option value="locked">Locked</option>
              <option value="declined">Declined</option>
              <option value="resolved">Resolved</option>
            </select>
          </div>

          <button id="filter-clear" class="secondary" onclick="clearFilters()" style="display:none;padding:6px 14px;font-size:13px;align-self:flex-end;">✕ Clear Filters</button>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID / Date</th>
            <th>Name</th>
            <th>Violation</th>
            <th>Points</th>
            <th>Status</th>
            <th>Code</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tickets-table">
          <tr><td colspan="7" style="color:var(--muted)">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>14-T Home Citation System</footer>
  <script src="app.js"></script>
</body>
</html>
