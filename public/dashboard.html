<!-- public/dashboard.html -->
<!-- 14-T Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14-T — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="logo">14-T</div>
      <div class="tagline">Home Citation System</div>
    </div>
    <nav>
      <a href="index.html">New Ticket</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="reports.html">Reports</a>
      <a href="management.html">Management</a>
      
    </nav>
  </header>

  <main id="dashboard">
    <h1>Dashboard</h1>

    <div class="card">
      <h2>Points Leaderboard</h2>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Total Points</th>
          </tr>
        </thead>
        <tbody id="leaderboard">
          <tr><td colspan="2" style="color:var(--muted)">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <h2 style="margin-bottom:0;">All Citations</h2>
        <span id="tickets-count" style="font-size:13px;color:var(--muted);"></span>
      </div>

      <!-- Filter Bar -->
      <div style="background:var(--bg);border:1px solid var(--border);padding:14px 16px;margin-bottom:16px;">
        <div id="filter-bar"></div>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID / Date</th>
            <th>Name</th>
            <th>Violation</th>
            <th>Points</th>
            <th>Status</th>
            <th>Code</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tickets-table">
          <tr><td colspan="7" style="color:var(--muted)">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>14-T Home Citation System</footer>
  <script src="app.js"></script>
</body>
</html>
