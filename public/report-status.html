<!-- public/report-status.html -->
<!-- 14-T Report Status -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14-T — Report Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <div class="logo">14-T</div>
      <div class="tagline">Home Citation System</div>
    </div>
  </header>

  <main>
    <div id="status-view">
      <div class="msg" style="display:block;background:var(--blue-light);color:var(--blue-dark);padding:14px;">Loading report...</div>
    </div>
  </main>

  <footer>14-T Home Citation System</footer>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const container = document.getElementById('status-view');

    if (!id) {
      container.innerHTML = '<div class="msg error" style="display:block;">No report ID provided.</div>';
    } else {
      fetch(`/api/reports?id=${id}`)
        .then(r => r.json())
        .then(async data => {
          if (!data || data.error || !data.report) {
            container.innerHTML = '<div class="msg error" style="display:block;">Report not found.</div>';
            return;
          }
          const r = data.report;
          const date = new Date(r.created_at).toLocaleString();

          // Status steps
          const steps = [
            { key: 'open',     label: 'Submitted',      desc: 'Your report has been received.' },
            { key: 'reviewed', label: 'Under Review',   desc: 'Your report is being looked into.' },
            { key: 'closed',   label:
                r.status === 'ticket_created' ? 'Ticket Issued' :
                r.status === 'declined' ? 'Not Actioned' :
                r.status === 'accepted_silent' ? 'Unknown Status' : 'Closed',
              desc:
                r.status === 'ticket_created' ? 'A citation has been issued based on your report. Thank you for letting us know.' :
                r.status === 'declined' ? `This report was reviewed but no action was taken.${r.decline_reason ? ' Reason: ' + r.decline_reason : ''}` :
                r.status === 'accepted_silent' ? 'This report has been reviewed. No further information is available at this time.' :
                'This report has been closed.' }
          ];

          const stepOrder = { open: 0, reviewed: 1, ticket_created: 2, declined: 2, accepted_silent: 2 };
          const currentStep = stepOrder[r.status] ?? 0;

          const stepsHtml = steps.map((s, i) => {
            const done = i < currentStep;
            const active = i === currentStep;
            const color = active && r.status === 'declined' ? 'var(--accent)' : active || done ? 'var(--success)' : 'var(--border)';
            return `
              <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:16px;">
                <div style="width:28px;height:28px;border-radius:50%;background:${done || active ? color : 'var(--bg)'};border:2px solid ${color};display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;">
                  ${done ? '<span style="color:#fff;font-size:13px;">✓</span>' : `<span style="font-size:11px;font-weight:700;color:${active ? (r.status==='declined'?'var(--accent)':'var(--success)') : 'var(--muted)'};">${i+1}</span>`}
                </div>
                <div>
                  <div style="font-weight:700;font-size:14px;color:${active ? (r.status==='declined'?'var(--accent)':'var(--blue-dark)') : done ? 'var(--success)' : 'var(--muted)'};">${s.label}</div>
                  ${active || done ? `<div style="font-size:13px;color:var(--muted);margin-top:2px;">${s.desc}</div>` : ''}
                </div>
              </div>`;
          }).join('');

          const ticketInfoHtml = r.linked_ticket_id ? await fetch(`/api/tickets?id=${r.linked_ticket_id}`)
            .then(res => res.json())
            .then(td => {
              const t = td.ticket;
              if (!t) return '';
              return `
                <div class="card" style="margin-bottom:16px;border-top:3px solid var(--blue);">
                  <h2 style="margin-bottom:8px;">Citation Issued</h2>
                  <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">A citation was issued as a result of this report.</p>
                  ${t.penal_code ? `<div style="font-size:13px;"><strong>Penal Code:</strong> ${t.penal_code}</div>` : ''}
                </div>`;
            })
            .catch(() => '') : '';

          container.innerHTML = `
            <h1 style="margin-bottom:4px;">Report Status</h1>
            <div style="font-size:13px;color:var(--muted);font-family:monospace;margin-bottom:20px;">${r.id}</div>

            <div class="card" style="margin-bottom:16px;">
              <h2 style="margin-bottom:14px;">Status</h2>
              ${stepsHtml}
            </div>

            ${ticketInfoHtml}

            <div class="card">
              <h2 style="margin-bottom:14px;">Your Report</h2>
              <div class="info-row"><span class="label">Submitted</span><span>${date}</span></div>
              <div class="info-row"><span class="label">Location</span><span>${r.location}</span></div>
              <div class="info-row"><span class="label">Item</span><span>${r.item}</span></div>
              ${r.owner ? `<div class="info-row"><span class="label">Possible Owner</span><span>${r.owner}</span></div>` : ''}
              <div style="margin-top:12px;background:var(--bg);padding:10px;font-size:13px;border-left:3px solid var(--border);">${r.description}</div>
              ${r.photo_base64 ? `<img src="${r.photo_base64}" style="width:100%;max-height:260px;object-fit:cover;border:1px solid var(--border);margin-top:12px;">` : ''}
            </div>`;
        })
        .catch(() => {
          container.innerHTML = '<div class="msg error" style="display:block;">Failed to load report.</div>';
        });
    }
  </script>
</body>
</html>
